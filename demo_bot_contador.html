<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS · Bot Contador Helena · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,sans-serif}
body{
  background:#0b141a;
  display:flex;flex-direction:column;
  color:#e9edef;
  position:relative;
}

/* HEADER */
.header{
  background:#202c33;
  padding:10px 16px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid #0a1014;
  flex-shrink:0;
  position:relative;
  z-index:10;
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#00d4ff 0%,#0099b8 100%);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#0b141a;
  letter-spacing:0.05em;
  box-shadow:0 0 12px rgba(0,212,255,0.3);
}
.head-info{flex:1;min-width:0}
.head-info h2{
  font-size:15px;font-weight:600;color:#e9edef;
  display:flex;align-items:center;gap:6px;
}
.head-info h2::after{
  content:"";width:6px;height:6px;background:#00d4ff;border-radius:50%;
  box-shadow:0 0 6px #00d4ff;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.head-info p{font-size:11px;color:#8696a0;margin-top:2px}
.head-icons{display:flex;gap:18px;color:#aebac1;font-size:18px}

/* DEMO BANNER */
.demo-banner{
  background:linear-gradient(90deg,rgba(255,182,39,0.12) 0%,rgba(0,212,255,0.08) 100%);
  border-bottom:1px solid rgba(255,182,39,0.2);
  padding:8px 16px;
  font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;
  color:#ffb627;text-align:center;font-weight:600;
  flex-shrink:0;
}
.demo-banner b{color:#00d4ff}

/* CHAT AREA */
.chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  background-color:#0b141a;
  background-image:
    radial-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
    radial-gradient(rgba(0,212,255,0.02) 1px, transparent 1px);
  background-size:24px 24px, 48px 48px;
  background-position:0 0, 12px 12px;
  display:flex;flex-direction:column;gap:8px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

/* MESSAGES */
.msg{
  max-width:85%;
  padding:8px 12px;
  border-radius:8px;
  font-size:14.5px;line-height:1.4;
  word-wrap:break-word;
  position:relative;
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.bot{
  align-self:flex-start;
  background:#202c33;
  border-bottom-left-radius:2px;
  color:#e9edef;
}
.msg.bot::before{
  content:"";position:absolute;left:-6px;bottom:0;
  width:0;height:0;border-style:solid;border-width:0 0 8px 8px;
  border-color:transparent transparent #202c33 transparent;
}
.msg.user{
  align-self:flex-end;
  background:#005c4b;
  border-bottom-right-radius:2px;
  color:#e9edef;
}
.msg.user::before{
  content:"";position:absolute;right:-6px;bottom:0;
  width:0;height:0;border-style:solid;border-width:0 8px 8px 0;
  border-color:transparent #005c4b transparent transparent;
}
.msg .time{
  font-size:10px;color:#8696a0;
  margin-top:2px;text-align:right;
  display:flex;justify-content:flex-end;align-items:center;gap:4px;
}
.msg.user .time{color:#a4d2c5}
.msg .check{font-size:11px;color:#53bdeb}
.msg b{font-weight:700;color:#fff}
.msg em{font-style:normal;color:#ffb627;font-weight:600}

/* TYPING */
.typing{
  align-self:flex-start;
  background:#202c33;
  padding:12px 16px;border-radius:8px;border-bottom-left-radius:2px;
  display:flex;gap:4px;
  animation:fadeIn 0.2s ease;
}
.typing span{
  width:7px;height:7px;background:#8696a0;border-radius:50%;
  animation:bounce 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-6px);opacity:1}}

/* QUICK MENU */
.menu{
  align-self:flex-start;
  background:#1f2c33;
  padding:6px;border-radius:8px;border:1px solid #2a3942;
  display:flex;flex-wrap:wrap;gap:6px;
  max-width:90%;
  animation:fadeIn 0.4s ease;
}
.menu-btn{
  background:#2a3942;color:#e9edef;
  border:none;padding:8px 12px;border-radius:6px;
  font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:6px;
  font-family:inherit;
}
.menu-btn:hover,.menu-btn:active{background:#00d4ff;color:#0b141a}
.menu-btn .ic{font-size:14px}

/* REPORT CARDS (inside messages) */
.report{
  margin-top:8px;padding:10px;
  background:rgba(0,0,0,0.2);
  border-left:3px solid #00d4ff;
  border-radius:4px;font-size:13px;
}
.report .r-title{
  font-weight:700;color:#00d4ff;margin-bottom:6px;
  font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
}
.report .r-row{
  display:flex;justify-content:space-between;
  padding:3px 0;border-bottom:1px dashed rgba(255,255,255,0.08);
}
.report .r-row:last-child{border-bottom:none}
.report .r-row .lbl{color:#8696a0;font-size:12px}
.report .r-row .val{color:#fff;font-weight:600;font-size:13px}
.report .r-row .val.green{color:#00d4ff}
.report .r-row .val.red{color:#ff6b6b}
.report .r-row .val.amber{color:#ffb627}

.alert-box{
  margin-top:8px;padding:10px 12px;
  background:rgba(255,107,107,0.1);
  border:1px solid rgba(255,107,107,0.3);
  border-radius:6px;
  font-size:13px;
}
.alert-box .at{
  font-size:11px;color:#ff6b6b;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;
}

/* INPUT */
.input-bar{
  background:#202c33;
  padding:8px 10px;
  display:flex;align-items:center;gap:8px;
  border-top:1px solid #0a1014;
  flex-shrink:0;
}
.input-bar .input-wrap{
  flex:1;background:#2a3942;
  border-radius:24px;
  padding:9px 14px;
  display:flex;align-items:center;gap:10px;
}
.input-bar input{
  flex:1;background:none;border:none;outline:none;
  color:#e9edef;font-size:14px;font-family:inherit;
}
.input-bar input::placeholder{color:#8696a0}
.input-bar .icon-btn{
  color:#8696a0;font-size:20px;
  background:none;border:none;cursor:pointer;
  width:32px;height:32px;display:flex;
  align-items:center;justify-content:center;
}
.input-bar .send-btn{
  width:42px;height:42px;border-radius:50%;
  background:#00d4ff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:#0b141a;font-size:18px;font-weight:700;
  flex-shrink:0;
  box-shadow:0 0 12px rgba(0,212,255,0.3);
}
.input-bar .send-btn:active{transform:scale(0.95)}

/* RESET BTN */
.reset-btn{
  position:fixed;top:64px;right:12px;z-index:20;
  background:rgba(0,212,255,0.15);
  border:1px solid rgba(0,212,255,0.4);
  color:#00d4ff;
  padding:6px 12px;border-radius:20px;
  font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
  font-weight:600;cursor:pointer;font-family:inherit;
  backdrop-filter:blur(8px);
  display:none;
}
.reset-btn.visible{display:block;animation:fadeIn 0.3s}

/* SCROLLBAR */
.chat::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="avatar">JC</div>
  <div class="head-info">
    <h2>JARVIS Contador</h2>
    <p>en línea · responde al instante</p>
  </div>
  <div class="head-icons">
    <span>📞</span>
    <span>⋮</span>
  </div>
</div>

<!-- DEMO BANNER -->
<div class="demo-banner">
  // <b>DEMO INTERACTIVO</b> · BOT CONTADOR HELENA · TOCA UNA OPCIÓN
</div>

<!-- RESET -->
<button class="reset-btn" id="resetBtn" onclick="resetChat()">↻ Reiniciar demo</button>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- INPUT -->
<div class="input-bar">
  <button class="icon-btn">😊</button>
  <div class="input-wrap">
    <input type="text" id="userInput" placeholder="Escribe un mensaje" autocomplete="off">
    <button class="icon-btn">📎</button>
  </div>
  <button class="send-btn" onclick="sendCustom()">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const resetBtn = document.getElementById('resetBtn');

function now(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

function scrollDown(){
  setTimeout(()=>{ chat.scrollTop = chat.scrollHeight; }, 50);
}

function addBotMsg(html, delay=600){
  return new Promise(resolve=>{
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(typing);
    scrollDown();

    setTimeout(()=>{
      typing.remove();
      const msg = document.createElement('div');
      msg.className = 'msg bot';
      msg.innerHTML = html + `<div class="time">${now()}</div>`;
      chat.appendChild(msg);
      scrollDown();
      resolve();
    }, delay);
  });
}

function addUserMsg(text){
  const msg = document.createElement('div');
  msg.className = 'msg user';
  msg.innerHTML = text + `<div class="time">${now()}<span class="check">✓✓</span></div>`;
  chat.appendChild(msg);
  scrollDown();
  resetBtn.classList.add('visible');
}

function addMenu(options){
  const menu = document.createElement('div');
  menu.className = 'menu';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'menu-btn';
    btn.innerHTML = `<span class="ic">${opt.ic}</span> ${opt.label}`;
    btn.onclick = ()=>{
      menu.remove();
      addUserMsg(opt.label);
      handleAction(opt.action);
    };
    menu.appendChild(btn);
  });
  chat.appendChild(menu);
  scrollDown();
}

async function handleAction(action){
  switch(action){

    case 'start':
      await addBotMsg(`Hola Juan 👋 Soy <b>JARVIS Contador</b>, el agente contable de Helena.<br><br>Estoy conectado al inventario, facturación, cartera, proveedores y nómina. ¿Qué quieres revisar hoy?`);
      mainMenu();
      break;

    case 'main':
      mainMenu();
      break;

    // ============ ESTADOS FINANCIEROS ============
    case 'pyg':
      await addBotMsg(`📊 <b>P&G del mes en curso</b> (al ${now()} hoy)
<div class="report">
<div class="r-title">// MERCICO · ABRIL 2026</div>
<div class="r-row"><span class="lbl">Ventas brutas</span><span class="val green">$ 4.820.000</span></div>
<div class="r-row"><span class="lbl">Devoluciones</span><span class="val red">- $ 95.000</span></div>
<div class="r-row"><span class="lbl">Ventas netas</span><span class="val">$ 4.725.000</span></div>
<div class="r-row"><span class="lbl">COGS</span><span class="val red">- $ 2.890.000</span></div>
<div class="r-row"><span class="lbl">Utilidad bruta</span><span class="val green">$ 1.835.000</span></div>
<div class="r-row"><span class="lbl">Gastos operativos</span><span class="val red">- $ 720.000</span></div>
<div class="r-row"><span class="lbl">Nómina + parafiscales</span><span class="val red">- $ 480.000</span></div>
<div class="r-row"><span class="lbl"><b>EBITDA</b></span><span class="val green"><b>$ 635.000</b></span></div>
<div class="r-row"><span class="lbl">Margen EBITDA</span><span class="val amber">13.4%</span></div>
</div>
¿Quieres ver balance, flujo de caja, o ir a otro módulo?`);
      backMenu(['balance','flujo','main']);
      break;

    case 'balance':
      await addBotMsg(`📋 <b>Balance General · cierre abril</b>
<div class="report">
<div class="r-title">// ACTIVOS</div>
<div class="r-row"><span class="lbl">Caja y bancos</span><span class="val">$ 1.240.000</span></div>
<div class="r-row"><span class="lbl">Cuentas por cobrar</span><span class="val">$ 3.180.000</span></div>
<div class="r-row"><span class="lbl">Inventario</span><span class="val">$ 8.450.000</span></div>
<div class="r-row"><span class="lbl">Activos fijos</span><span class="val">$ 2.100.000</span></div>
<div class="r-row"><span class="lbl"><b>Total activos</b></span><span class="val green"><b>$ 14.970.000</b></span></div>
</div>
<div class="report">
<div class="r-title">// PASIVOS Y PATRIMONIO</div>
<div class="r-row"><span class="lbl">CxP proveedores</span><span class="val">$ 2.480.000</span></div>
<div class="r-row"><span class="lbl">Obligaciones financieras</span><span class="val">$ 3.500.000</span></div>
<div class="r-row"><span class="lbl">Impuestos por pagar</span><span class="val">$ 890.000</span></div>
<div class="r-row"><span class="lbl">Patrimonio</span><span class="val">$ 8.100.000</span></div>
</div>`);
      backMenu(['flujo','pyg','main']);
      break;

    case 'flujo':
      await addBotMsg(`💵 <b>Flujo de caja · abril 2026</b>
<div class="report">
<div class="r-title">// MOVIMIENTOS DEL MES</div>
<div class="r-row"><span class="lbl">Saldo inicial</span><span class="val">$ 980.000</span></div>
<div class="r-row"><span class="lbl">Ingresos operativos</span><span class="val green">+ $ 4.250.000</span></div>
<div class="r-row"><span class="lbl">Pagos a proveedores</span><span class="val red">- $ 2.180.000</span></div>
<div class="r-row"><span class="lbl">Nómina</span><span class="val red">- $ 480.000</span></div>
<div class="r-row"><span class="lbl">Impuestos</span><span class="val red">- $ 320.000</span></div>
<div class="r-row"><span class="lbl">Gastos operativos</span><span class="val red">- $ 720.000</span></div>
<div class="r-row"><span class="lbl"><b>Saldo actual</b></span><span class="val green"><b>$ 1.530.000</b></span></div>
<div class="r-row"><span class="lbl">Proyección 30 días</span><span class="val amber">$ 2.140.000</span></div>
</div>
⚠️ Próximo pago crítico: <b>Distrimóviles SAS</b> $580.000 vence en 3 días.`);
      backMenu(['pyg','balance','main']);
      break;

    // ============ CARTERA Y RECAUDO ============
    case 'cartera':
      await addBotMsg(`📥 <b>Cartera por cobrar · estado actual</b>
<div class="report">
<div class="r-title">// CXC POR EDAD DE MORA</div>
<div class="r-row"><span class="lbl">Al día (0-30 d)</span><span class="val green">$ 1.890.000</span></div>
<div class="r-row"><span class="lbl">31-60 días</span><span class="val amber">$ 720.000</span></div>
<div class="r-row"><span class="lbl">61-90 días</span><span class="val amber">$ 380.000</span></div>
<div class="r-row"><span class="lbl">+90 días (crítico)</span><span class="val red">$ 190.000</span></div>
<div class="r-row"><span class="lbl"><b>Total CxC</b></span><span class="val"><b>$ 3.180.000</b></span></div>
<div class="r-row"><span class="lbl">Provisión cartera</span><span class="val red">$ 95.000</span></div>
</div>
<div class="alert-box">
<div class="at">⚠️ ALERTAS</div>
• <b>Tienda Don Pepe</b> · $190.000 · 95 días vencido<br>
• <b>Móviles del Sur</b> · $145.000 · 67 días vencido<br>
• <b>Cell Express</b> · $85.000 · 54 días vencido
</div>
¿Genero recordatorios de cobro automáticos?`);
      backMenu(['cobros','main']);
      break;

    case 'cobros':
      await addBotMsg(`✅ <b>Listo, recordatorios enviados.</b><br><br>Acabo de enviar mensaje por WhatsApp a los 3 clientes en mora con su saldo, días vencidos y opciones de pago.<br><br>Te aviso cuando alguno responda. 📩`);
      backMenu(['cartera','main']);
      break;

    // ============ CXP Y PROVEEDORES ============
    case 'cxp':
      await addBotMsg(`📤 <b>Cuentas por pagar · proveedores</b>
<div class="report">
<div class="r-title">// PRÓXIMOS VENCIMIENTOS</div>
<div class="r-row"><span class="lbl">Distrimóviles SAS</span><span class="val red">$ 580.000 · 3 días</span></div>
<div class="r-row"><span class="lbl">Accesorios Pro</span><span class="val amber">$ 320.000 · 8 días</span></div>
<div class="r-row"><span class="lbl">Tech Importaciones</span><span class="val amber">$ 890.000 · 12 días</span></div>
<div class="r-row"><span class="lbl">Logística Veloz</span><span class="val">$ 145.000 · 18 días</span></div>
<div class="r-row"><span class="lbl">Empaques del Norte</span><span class="val">$ 235.000 · 22 días</span></div>
<div class="r-row"><span class="lbl">Otros proveedores</span><span class="val">$ 310.000</span></div>
<div class="r-row"><span class="lbl"><b>Total CxP</b></span><span class="val"><b>$ 2.480.000</b></span></div>
</div>
<div class="alert-box">
<div class="at">🚨 PAGO CRÍTICO</div>
<b>Distrimóviles SAS</b> vence en 3 días. Caja proyectada cubre el pago.<br>¿Programo transferencia?
</div>`);
      backMenu(['programar','main']);
      break;

    case 'programar':
      await addBotMsg(`✅ <b>Pago programado.</b><br><br>Distrimóviles SAS · $580.000 · transferencia el ${new Date(Date.now()+86400000*2).toLocaleDateString('es-CO')}.<br><br>Aviso al área financiera y al banco. Comprobante llega a tu correo automático. 📧`);
      backMenu(['cxp','main']);
      break;

    // ============ FISCAL DIAN ============
    case 'fiscal':
      await addBotMsg(`🏛️ <b>Fiscal y tributario · abril 2026</b>
<div class="report">
<div class="r-title">// OBLIGACIONES DIAN</div>
<div class="r-row"><span class="lbl">IVA bimestre Mar-Abr</span><span class="val amber">$ 485.000 · vence 17 may</span></div>
<div class="r-row"><span class="lbl">ReteFuente abril</span><span class="val amber">$ 215.000 · vence 12 may</span></div>
<div class="r-row"><span class="lbl">ICA Bogotá</span><span class="val">$ 145.000 · vence 25 may</span></div>
<div class="r-row"><span class="lbl">Renta 2025 (cuota)</span><span class="val">$ 380.000 · vence 30 jun</span></div>
<div class="r-row"><span class="lbl"><b>Total impuestos</b></span><span class="val"><b>$ 1.225.000</b></span></div>
</div>
<div class="alert-box">
<div class="at">📅 PRÓXIMA DECLARACIÓN</div>
<b>ReteFuente</b> vence el 12 de mayo · 12 días<br>
Borrador listo en sistema. ¿Lo reviso contigo?
</div>`);
      backMenu(['niif','nomina','main']);
      break;

    case 'niif':
      await addBotMsg(`🔍 <b>Control interno · NIIF</b>
<div class="report">
<div class="r-title">// AUDITORÍA AUTOMÁTICA · ÚLTIMOS 30 DÍAS</div>
<div class="r-row"><span class="lbl">Asientos revisados</span><span class="val green">1.247</span></div>
<div class="r-row"><span class="lbl">Cuadre contable</span><span class="val green">✓ OK</span></div>
<div class="r-row"><span class="lbl">Inconsistencias</span><span class="val amber">3 menores</span></div>
<div class="r-row"><span class="lbl">Soportes faltantes</span><span class="val red">2 facturas</span></div>
<div class="r-row"><span class="lbl">Cumplimiento NIIF</span><span class="val green">98%</span></div>
</div>
<div class="alert-box">
<div class="at">⚠️ REVISAR</div>
• Factura FE-2847 sin soporte adjunto<br>
• Factura FE-2851 sin soporte adjunto<br>
• Diferencia de $1.200 en cuenta 1110
</div>`);
      backMenu(['fiscal','main']);
      break;

    // ============ NÓMINA ============
    case 'nomina':
      await addBotMsg(`👥 <b>Nómina y RRHH · abril 2026</b>
<div class="report">
<div class="r-title">// NÓMINA DEL MES</div>
<div class="r-row"><span class="lbl">Empleados activos</span><span class="val">8</span></div>
<div class="r-row"><span class="lbl">Salarios brutos</span><span class="val">$ 380.000</span></div>
<div class="r-row"><span class="lbl">Aportes salud</span><span class="val">$ 32.300</span></div>
<div class="r-row"><span class="lbl">Aportes pensión</span><span class="val">$ 45.600</span></div>
<div class="r-row"><span class="lbl">ARL</span><span class="val">$ 1.980</span></div>
<div class="r-row"><span class="lbl">Parafiscales (SENA, ICBF, Cajas)</span><span class="val">$ 34.200</span></div>
<div class="r-row"><span class="lbl">Provisiones (cesantías, prima, vacaciones)</span><span class="val">$ 84.700</span></div>

// CUSTOM INPUT (basic NLP simulation)
function sendCustom(){
  const input = document.getElementById('userInput');
  const txt = input.value.trim();
  if(!txt) return;
  addUserMsg(txt);
  input.value = '';
  handleCustom(txt.toLowerCase());
}

document.getElementById('userInput').addEventListener('keypress',e=>{
  if(e.key==='Enter') sendCustom();
});

async function handleCustom(t){
  // Simple keyword routing
  if(/vend|ventas|ingreso|facturaci/.test(t)){
    await addBotMsg(`Te muestro las <b>ventas</b> 👇`);
    handleAction('pyg');
  } else if(/cartera|cobr|deuda.*client|moroso/.test(t)){
    await addBotMsg(`Aquí tu <b>cartera</b> 👇`);
    handleAction('cartera');
  } else if(/proveedor|pagar|cxp|debo/.test(t)){
    await addBotMsg(`Aquí <b>cuentas por pagar</b> 👇`);
    handleAction('cxp');
  } else if(/iva|dian|impuesto|fiscal|retefuente|ica/.test(t)){
    await addBotMsg(`Te muestro lo <b>fiscal</b> 👇`);
    handleAction('fiscal');
  } else if(/n[oó]mina|empleado|salario|sueldo|parafiscal/.test(t)){
    await addBotMsg(`Aquí <b>nómina</b> 👇`);
    handleAction('nomina');
  } else if(/caja|flujo|saldo/.test(t)){
    await addBotMsg(`Tu <b>flujo de caja</b> 👇`);
    handleAction('flujo');
  } else if(/balance|activo|pasivo/.test(t)){
    await addBotMsg(`Aquí <b>balance</b> 👇`);
    handleAction('balance');
  } else if(/margen|costo|rentab|utilidad/.test(t)){
    await addBotMsg(`Aquí <b>costos y márgenes</b> 👇`);
    handleAction('costos');
  } else if(/reporte|correo|email/.test(t)){
    await addBotMsg(`Te muestro la configuración de <b>reportes automáticos</b> 👇`);
    handleAction('reportes');
  } else if(/hola|buenos|buenas|hi|hey/.test(t)){
    await addBotMsg(`¡Hola! 👋 ¿Qué módulo quieres revisar?`);
    mainMenu();
  } else if(/gracias|ok|listo|perfecto/.test(t)){
    await addBotMsg(`Para servirte 🙌 ¿Algo más?`);
    mainMenu();
  } else {
    await addBotMsg(`Procesé tu pregunta: <em>"${t}"</em><br><br>En el bot real, este input va al motor de IA y consulta el sistema contable de Helena para darte una respuesta exacta.<br><br>En este demo, te dejo el menú para que explores 👇`);
    mainMenu();
  }
}

function resetChat(){
  chat.innerHTML = '';
  resetBtn.classList.remove('visible');
  setTimeout(()=>handleAction('start'), 200);
}

// START
window.addEventListener('load',()=>{
  setTimeout(()=>handleAction('start'), 500);
});
