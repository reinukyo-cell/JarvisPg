<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VetBot / Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root {
  --bg:#080b0f;
  --s1:#0e1318;
  --s2:#131920;
  --s3:#1a2330;
  --b1:#1e2d3d;
  --b2:#253545;
  --accent:#00d4aa;
  --adim:rgba(0,212,170,.12);
  --amber:#f59e0b;
  --adim2:rgba(245,158,11,.1);
  --red:#ef4444;
  --rdim:rgba(239,68,68,.1);
  --blue:#3b82f6;
  --bdim:rgba(59,130,246,.1);
  --tx:#e2f0ff;
  --tx2:#7a9bb5;
  --tx3:#3d5a73;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px}

/* HEADER */
header{width:100%;max-width:760px;display:flex;align-items:center;gap:10px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--b1)}
.hdot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.htitle{font-family:var(--mono);font-size:.9rem;font-weight:600;letter-spacing:.5px}
.htitle span{color:var(--tx3);font-weight:400}
.hbadge{margin-left:auto;font-family:var(--mono);font-size:.62rem;color:var(--accent);border:1px solid rgba(0,212,170,.22);padding:3px 8px;border-radius:4px;letter-spacing:1px}

/* SCENARIOS */
.sc-label{font-family:var(--mono);font-size:.62rem;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px;width:100%;max-width:760px}
.sc-row{display:flex;flex-wrap:wrap;gap:7px;width:100%;max-width:760px;margin-bottom:20px}
.sc-btn{font-family:var(--mono);font-size:.72rem;padding:6px 14px;border-radius:5px;border:1px solid var(--b2);background:var(--s2);color:var(--tx2);cursor:pointer;transition:all .15s}
.sc-btn:hover{border-color:var(--accent);color:var(--tx)}
.sc-btn.active{border-color:var(--accent);color:var(--accent);background:var(--adim)}

/* DESC */
.sc-desc{width:100%;max-width:760px;margin-bottom:18px;font-family:var(--mono);font-size:.68rem;color:var(--tx2);background:var(--s2);border-left:2px solid var(--accent);padding:9px 13px;border-radius:0 6px 6px 0;line-height:1.65}

/* DUAL PHONES */
.phones{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:760px}

/* PHONE */
.phone{background:var(--s1);border:1px solid var(--b1);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 32px rgba(0,0,0,.5)}
.ph-label{text-align:center;font-family:var(--mono);font-size:.6rem;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;padding:5px 0 0}

/* TOPBAR */
.topbar{background:var(--s2);padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--b1)}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.av-green{background:linear-gradient(135deg,#00b894,#007a66);box-shadow:0 0 8px rgba(0,212,170,.2)}
.av-blue{background:linear-gradient(135deg,#1d4ed8,#1e3a8a);box-shadow:0 0 8px rgba(59,130,246,.2)}
.tb-name{font-family:var(--mono);font-size:.78rem;font-weight:600}
.tb-status{font-size:.65rem;color:var(--accent);font-family:var(--mono)}
.tb-back{color:var(--blue);font-size:.9rem;margin-right:2px}

/* PROG */
.prog{height:2px;background:var(--b1)}.progf{height:100%;background:var(--accent);width:0%;transition:width .4s linear;box-shadow:0 0 5px var(--accent)}

/* CHAT */
.chat{height:380px;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.chat::-webkit-scrollbar{width:2px}.chat::-webkit-scrollbar-thumb{background:var(--b1);border-radius:1px}

/* BUBBLES */
.mw{display:flex;flex-direction:column}
.mw.bot{align-items:flex-start}.mw.user{align-items:flex-end}
.bub{padding:8px 11px;border-radius:12px;font-size:.78rem;line-height:1.5;max-width:88%;animation:pop .2s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(4px)}to{opacity:1;transform:none}}
.mw.bot .bub{background:var(--s3);border:1px solid var(--b1);border-bottom-left-radius:3px;color:var(--tx)}
.mw.user .bub{background:#0d3d5c;border:1px solid #1a5a7a;border-bottom-right-radius:3px;color:var(--tx)}
.mt{font-size:.58rem;color:var(--tx3);font-family:var(--mono);margin-top:2px;padding:0 3px}
.mw.user .mt{text-align:right}

/* NOTIFICATION CARD */
.ncard{background:var(--s2);border:1px solid var(--b2);border-radius:9px;padding:9px 11px;max-width:92%;animation:pop .22s cubic-bezier(.34,1.56,.64,1) both;align-self:flex-start}
.ncard.internal{border-left:2px solid var(--red);background:rgba(239,68,68,.04)}
.ncard.warning{border-left:2px solid var(--amber);background:rgba(245,158,11,.04)}
.ncard.ok{border-left:2px solid var(--accent);background:rgba(0,212,170,.04)}
.ncard.info{border-left:2px solid var(--blue);background:rgba(59,130,246,.04)}
.nlabel{font-family:var(--mono);font-size:.58rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.nl-red{color:var(--red)}.nl-amber{color:var(--amber)}.nl-accent{color:var(--accent)}.nl-blue{color:var(--blue)}
.nbody{font-size:.76rem;line-height:1.5;color:var(--tx)}
.nmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.nchip{font-family:var(--mono);font-size:.56rem;border:1px solid var(--b2);padding:1px 6px;border-radius:3px;color:var(--tx3)}

/* TYPING */
.typing{align-items:flex-start}
.tdots{background:var(--s3);border:1px solid var(--b1);border-radius:12px;border-bottom-left-radius:3px;padding:8px 12px;display:flex;gap:3px;align-items:center}
.td{width:5px;height:5px;border-radius:50%;background:var(--tx3);animation:td 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:scale(1);background:var(--tx3)}30%{transform:scale(1.5);background:var(--accent)}}

/* DIVIDER */
.divline{text-align:center;font-family:var(--mono);font-size:.6rem;color:var(--tx3);padding:4px 0 6px;letter-spacing:.5px}

/* QR */
.qrw{padding:7px 8px 4px;display:flex;flex-wrap:wrap;gap:5px;background:var(--bg);border-top:1px solid var(--b1)}
.qrb{font-family:var(--mono);font-size:.65rem;padding:4px 10px;border-radius:4px;border:1px solid var(--b2);background:var(--s2);color:var(--tx2);cursor:pointer;transition:all .12s}
.qrb:hover{border-color:var(--accent);color:var(--accent)}

/* INPUT */
.ibar{padding:8px;border-top:1px solid var(--b1);background:var(--s2);display:flex;gap:6px}
.ifield{flex:1;background:var(--s3);border:1px solid var(--b2);border-radius:6px;padding:7px 10px;font-family:var(--sans);font-size:.76rem;color:var(--tx);outline:none;transition:border-color .15s}
.ifield:focus{border-color:var(--accent)}
.ifield::placeholder{color:var(--tx3)}
.isend{width:30px;height:30px;border-radius:5px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.9;transition:opacity .12s}
.isend:hover{opacity:1}
.isend svg{width:12px;height:12px}

footer{margin-top:24px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);letter-spacing:.5px}
</style>
</head>
<body>

<header>
  <div class="hdot"></div>
  <div class="htitle">VetBot <span>/ Demo interactiva</span></div>
  <div class="hbadge">DEMO</div>
</header>

<div class="sc-label">Elegir escenario</div>
<div class="sc-row">
  <button class="sc-btn active" onclick="load('vacuna',this)">💉 Alerta de vacuna</button>
  <button class="sc-btn" onclick="load('nuevo_cliente',this)">🆕 Nuevo cliente</button>
  <button class="sc-btn" onclick="load('cita',this)">📅 Agendar cita</button>
  <button class="sc-btn" onclick="load('tratamiento',this)">💊 Fin de tratamiento</button>
  <button class="sc-btn" onclick="load('guarderia',this)">🏠 Guardería</button>
  <button class="sc-btn" onclick="load('resumen_vet',this)">🔴 Resumen matutino vet</button>
</div>
<div class="sc-desc" id="sc-desc"></div>

<div class="phones">
  <!-- CLIENTE -->
  <div>
    <div class="ph-label" style="margin-bottom:6px">👤 cliente</div>
    <div class="phone">
      <div class="topbar">
        <span class="tb-back">‹</span>
        <div class="avatar av-green">🐾</div>
        <div><div class="tb-name">VetBot</div><div class="tb-status">● en línea</div></div>
      </div>
      <div class="prog"><div class="progf" id="prog-c"></div></div>
      <div class="chat" id="chat-c"></div>
      <div class="qrw" id="qr-c"></div>
      <div class="ibar">
        <input class="ifield" placeholder="Escribe..." id="in-c" onkeydown="if(event.key==='Enter')freeMsg('c')">
        <button class="isend" onclick="freeMsg('c')"><svg viewBox="0 0 24 24" fill="none" stroke="#080b0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
  </div>

  <!-- VET -->
  <div>
    <div class="ph-label" style="margin-bottom:6px">👨‍⚕️ veterinario</div>
    <div class="phone">
      <div class="topbar">
        <span class="tb-back">‹</span>
        <div class="avatar av-blue">🤖</div>
        <div><div class="tb-name">VetBot Admin</div><div class="tb-status" style="color:var(--blue)">● sistema</div></div>
      </div>
      <div class="prog"><div class="progf" id="prog-v"></div></div>
      <div class="chat" id="chat-v"></div>
      <div class="qrw" id="qr-v"></div>
      <div class="ibar">
        <input class="ifield" placeholder="Responder..." id="in-v" onkeydown="if(event.key==='Enter')freeMsg('v')">
        <button class="isend" onclick="freeMsg('v')"><svg viewBox="0 0 24 24" fill="none" stroke="#080b0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
  </div>
</div>

<footer>demo simulada · sin conexión real a Telegram / WhatsApp</footer>

/* ─── ENGINE ──────────────────────────────────────────────────────────────── */
let timers = [], typingC = null, typingV = null;

function clearAll() {
  timers.forEach(clearTimeout); timers = [];
  ['chat-c','chat-v','qr-c','qr-v'].forEach(id => document.getElementById(id).innerHTML = '');
  ['prog-c','prog-v'].forEach(id => document.getElementById(id).style.width = '0%');
  typingC = null; typingV = null;
}

function nowTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function addDivider(pane, txt) {
  const el = document.createElement('div');
  el.className = 'divline'; el.textContent = txt;
  document.getElementById('chat-'+pane).appendChild(el);
  scroll(pane);
}

function addBubble(pane, role, txt) {
  const c = document.getElementById('chat-'+pane);
  const w = document.createElement('div');
  w.className = `mw ${role}`;
  const b = document.createElement('div');
  b.className = 'bub';
  b.innerHTML = txt.replace(/\n/g,'<br>')
    .replace(/\*([^*]+)\*/g,'<strong>$1</strong>')
    .replace(/_([^_]+)_/g,'<em style="color:var(--tx2)">$1</em>');
  const mt = document.createElement('div');
  mt.className = 'mt'; mt.textContent = nowTime();
  w.appendChild(b); w.appendChild(mt);
  c.appendChild(w); scroll(pane);
}

function addNotif(pane, cls, lbl, nlbl, body, chips) {
  const c = document.getElementById('chat-'+pane);
  const el = document.createElement('div');
  el.className = `ncard ${cls}`;
  el.innerHTML = `<div class="nlabel ${nlbl}">${lbl}</div><div class="nbody">${body.replace(/\n/g,'<br>')}</div><div class="nmeta">${chips.map(ch=>`<span class="nchip">${ch}</span>`).join('')}</div>`;
  c.appendChild(el); scroll(pane);
}

function showTyp(pane) {
  const c = document.getElementById('chat-'+pane);
  const el = document.createElement('div');
  el.className = 'mw typing';
  el.innerHTML = `<div class="tdots"><div class="td"></div><div class="td"></div><div class="td"></div></div>`;
  c.appendChild(el); scroll(pane);
  if (pane==='c') typingC = el; else typingV = el;
}
function hideTyp(pane) {
  const el = pane==='c' ? typingC : typingV;
  if (el) { el.remove(); if(pane==='c') typingC=null; else typingV=null; }
}

function addQR(pane, opts) {
  const w = document.getElementById('qr-'+pane);
  w.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'qrb'; b.textContent = o;
    b.onclick = () => { w.innerHTML = ''; addBubble(pane, 'user', o); };
    w.appendChild(b);
  });
}

function scroll(pane) {
  const c = document.getElementById('chat-'+pane);
  c.scrollTop = c.scrollHeight;
}

function setProgress(pane, pct) {
  document.getElementById('prog-'+pane).style.width = pct + '%';
}

function load(key, btn) {
  clearAll();
  document.querySelectorAll('.sc-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const sc = SC[key];
  document.getElementById('sc-desc').textContent = sc.desc;

  const runPane = (pane, steps) => {
    const total = steps[steps.length-1].d + 2000;
    steps.forEach((step, i) => {
      const t = setTimeout(() => {
        hideTyp(pane);
        if (step.t==='div')    addDivider(pane, step.txt);
        else if (step.t==='bot')   addBubble(pane, 'bot', step.txt);
        else if (step.t==='user')  addBubble(pane, 'user', step.txt);
        else if (step.t==='ncard') addNotif(pane, step.cls, step.lbl, step.nlbl, step.body, step.chips);
        else if (step.t==='qr')    addQR(pane, step.opts);

        // show typing before next bot/ncard
        const nxt = steps[i+1];
        if (nxt && (nxt.t==='bot'||nxt.t==='ncard')) {
          const gap = nxt.d - step.d;
          if (gap > 150) timers.push(setTimeout(() => showTyp(pane), Math.max(80, step.d + gap*0.35 - step.d)));
        }

        setProgress(pane, Math.min(97, ((step.d+300)/total)*100));
      }, step.d);
      timers.push(t);
    });
    timers.push(setTimeout(() => setProgress(pane, 100), total));
  };

  runPane('c', sc.c);
  runPane('v', sc.v);
}

function freeMsg(pane) {
  const inp = document.getElementById('in-'+pane);
  const txt = inp.value.trim(); if (!txt) return;
  inp.value = '';
  addBubble(pane, 'user', txt);
  timers.push(setTimeout(() => {
    showTyp(pane);
    timers.push(setTimeout(() => {
      hideTyp(pane);
      addBubble(pane, 'bot', 'Usa los botones de escenario para explorar los flujos 👆');
    }, 900));
  }, 300));
}

// Init
load('vacuna', document.querySelector('.sc-btn.active'));
</script>
